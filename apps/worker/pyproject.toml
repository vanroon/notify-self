[project]
name = "worker"
version = "0.1.0"
description = "Poem notification worker for Mistral Workflows"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows>=3.10,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "temporalio>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
